name: Snapshot bond yield history

# Builds the measured record of what the FlareForward validator bond actually
# earns, one row per reward epoch, and publishes it to the `bond-yield` branch
# of the PUBLIC FlareForward/ftso-accuracy-data repo, which the Bonds page reads
# over raw.githubusercontent.com (worker/bondYield.ts).
#
# Why this job exists at all: the Flare Systems Explorer exposes only the LATEST
# reward epoch's reward figures. There is no historical rewards endpoint, so if
# nobody records an epoch while it is current, that epoch's numbers are gone for
# good. This job is the record.
#
# Why a separate public repo + branch: mirrors snapshot-performance.yml — this
# repo is PRIVATE (its raw URLs 404 for anonymous browsers), and the accuracy box
# force-pushes ftso-accuracy-data's `main`, so we publish to a dedicated branch
# the box never touches.
#
# Setup: reuses the same `ACCURACY_DATA_TOKEN` secret as snapshot-performance.yml
# (write access to FlareForward/ftso-accuracy-data). The `bond-yield` branch is
# created automatically on the first successful run.

on:
  schedule:
    # Hourly. Reward epochs are 3.5 days, so this is far more often than needed
    # to catch every epoch — the margin is deliberate, because a missed epoch is
    # unrecoverable. Rows are keyed by reward_epoch and the current (still
    # accruing) epoch is refreshed in place until it closes.
    - cron: "17 * * * *"
  workflow_dispatch: {}

concurrency:
  group: snapshot-bond-yield
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scripts (this repo)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Snapshot bond yield and publish
        env:
          TOKEN: ${{ secrets.ACCURACY_DATA_TOKEN }}
          # Read AND write the accumulated history from the checked-out branch,
          # so each run extends the exact committed state. Reading it over the
          # CDN instead could serve a stale copy and silently drop a row.
          HISTORY_PATH: bond-data/bond-yield-history.json
          OUT_PATH: bond-data/bond-yield-history.json
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ]; then
            echo "::error::ACCURACY_DATA_TOKEN secret is not set. It needs write access to FlareForward/ftso-accuracy-data (same secret snapshot-performance.yml uses)."
            exit 1
          fi

          REPO="https://x-access-token:${TOKEN}@github.com/FlareForward/ftso-accuracy-data.git"

          # Clone the bond-yield branch; create it as an orphan on first run.
          if git clone --depth 1 --branch bond-yield "$REPO" bond-data 2>/dev/null; then
            echo "Extending existing bond-yield branch."
          else
            echo "bond-yield branch not found; creating it."
            git clone --depth 1 "$REPO" bond-data
            (
              cd bond-data
              git checkout --orphan bond-yield
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi

          node scripts/snapshot-bond-yield.mjs

          cd bond-data
          git config user.name "flareforward-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bond-yield-history.json
          # --cached catches new (untracked) as well as modified files, so this
          # works on the very first run before the file exists on the branch.
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "data: bond-yield-history.json $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:bond-yield

      # Runs AFTER the row is committed, and deliberately as its own step: an
      # alert must never be able to cost us an epoch row, which is the one
      # irreplaceable thing this job produces. `always()` so it still fires on
      # the "no changes to commit" early exit above.
      #
      # There is no Discord/Slack webhook wired to this repo, so the alert
      # channel is job failure — GitHub emails on that, and it needs no new
      # secret. Tune ALERT_UNSWEPT_FLR rather than deleting the step.
      #
      # Why this exists: on 2026-09-02 Tier A sold out and 1,690,000 FLR sat
      # unswept in the mint contracts, earning nothing, while this job recorded
      # `lot_unswept_flr` faithfully every run and told no one. It happened again
      # on 2026-09-14 with 277,500 FLR across Lot 1 Tier B and Lot 2.
      - name: Alert on idle capital or lost delegation
        if: always()
        env:
          ALERT_UNSWEPT_FLR: "100000"
        run: |
          set -euo pipefail
          FILE=bond-data/bond-yield-history.json
          if [ ! -f "$FILE" ]; then
            echo "::warning::no history file to check"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const limit = Number(process.env.ALERT_UNSWEPT_FLR);
            const doc = JSON.parse(fs.readFileSync("bond-data/bond-yield-history.json", "utf8"));

            // The history file keys its array under `epochs`. An earlier draft of
            // this step looked for `rows`, found nothing, printed "no rows yet"
            // and exited 0 — a detector that could never fire. So: look under the
            // known keys, and if the document has content but no array we can
            // recognise, FAIL LOUDLY. Silent schema drift is the whole bug class.
            const list = Array.isArray(doc)
              ? doc
              : (doc.epochs ?? doc.rows ?? null);
            if (list === null) {
              console.log(`::error::bond-yield-history.json has no recognised row array (top-level keys: ${Object.keys(doc).join(", ")}). The schema moved and this alert is blind — fix the accessor.`);
              process.exit(1);
            }
            const last = list[list.length - 1];
            if (!last) { console.log("no rows yet"); process.exit(0); }

            const unswept = last.lot_unswept_flr;
            const bips = last.treasury_delegated_bips_to_us;
            let bad = false;

            // null means the chain read failed this hour, not that it is zero.
            // Staying quiet on null is deliberate: a false alarm every time an
            // RPC hiccups would train us to ignore this.
            if (unswept === null || unswept === undefined) {
              console.log("unswept unavailable this run — not alerting");
            } else if (unswept >= limit) {
              console.log(`::error::${unswept.toLocaleString()} FLR is sitting unswept in the lot contracts (threshold ${limit.toLocaleString()}). Native FLR in a lot earns NOTHING. Run: cd ~/nft-bond-series && source .venv/bin/activate && python3 script/sweep_lots.py sweep --execute --confirm sweep`);
              bad = true;
            } else {
              console.log(`unswept ${unswept.toLocaleString()} FLR — under the ${limit.toLocaleString()} threshold`);
            }

            if (bips === null || bips === undefined) {
              console.log("delegation unavailable this run — not alerting");
            } else if (bips < 10000) {
              console.log(`::error::treasury delegation to our provider is ${bips} bips, not 10000. Wrapped FLR has stopped earning and lost vote power.`);
              bad = true;
            }

            if (bad) {
              process.exit(1);
            }
          '
